/* ============================================================
   PRECIFICACAO — o coração do painel
   ------------------------------------------------------------
   A aba antiga respondia "quanto de produto gasto por
   atendimento". Isso sozinho engana: um esmalte de R$ 4 num
   serviço de R$ 45 parece margem de 91%.

   Só que o aluguel corre igual, o serviço ocupe 20 minutos ou
   3 horas. E se a hora dela não aparece no custo, qualquer preço
   acima do material parece lucro — e ela trabalha de graça
   achando que está ganhando.

   A conta é feita inteira no servidor (RPC precificacao) e esta
   tela só desenha o veredito.
============================================================ */
async function abaPrecificacao(){
  carregandoPainel();
  try{
    const [p, mats, cons, fixos] = await Promise.all([
      rpc('precificacao', {}),
      tabela('materials',         q => q.select('*').order('name')),
      tabela('service_materials', q => q.select('*')),
      tabela('fixed_costs',       q => q.select('*').order('valor_cents',{ascending:false}))
    ]);
    st.materiais = mats || []; st.consumo = cons || []; st.fixos = fixos || [];

    if(!p || !p.ok){
      painel().innerHTML = h`<div class="card"><h2>Precificação</h2>
        <div class="err">${(p && p.motivo) || 'Não consegui calcular'}</div></div>`;
      return;
    }
    st.preco = p;

    if(!st.matServico && st.servicos.length) st.matServico = st.servicos[0].id;

    painel().innerHTML =
        cardVeredito(p)
      + cardServicos(p)
      + cardCustosFixos(p)
      + cardParametros(p)
      + cardMateriais(p)
      + cardConsumo();

    const sel = $('#mat_service');
    if(sel) sel.addEventListener('change', () => { st.matServico = sel.value; abaPrecificacao(); });

    const oc = $('#pr_ocupacao');
    if(oc) oc.addEventListener('input', () => {
      const rot = document.querySelector('label[for="pr_ocupacao"]');
      if(rot) rot.textContent = 'Ocupação da agenda: ' + oc.value + '%';
    });

  }catch(e){
    painel().innerHTML = h`<div class="card"><h2>Precificação</h2>
      <div class="err">${e.message}</div>
      <div class="hint">Se a mensagem falar de função ou tabela que não existe, rode o
        <b>06_precificacao.sql</b> da pasta backend.</div></div>`;
  }
}

/* ---- 1. O número que resume tudo ---- */
function cardVeredito(p){
  const ruins  = (p.servicos||[]).filter(s => s.situacao === 'prejuizo');
  const abaixo = (p.servicos||[]).filter(s => s.situacao === 'abaixo_da_meta');
  const semCusto = p.custo_fixo_mes_cents === 0;

  return h`<div class="card">
    <h2>Quanto custa a sua hora</h2>
    <div class="sub">É desse número que sai todo preço mínimo abaixo.</div>

    ${semCusto ? raw(`<div class="alerta atencao">
      <b>Nenhum custo fixo cadastrado ainda.</b> Enquanto essa lista estiver vazia, o sistema
      acha que manter o studio aberto é de graça — e o preço mínimo só cobre o produto.

function numeroPeq(rot, val){

/* ---- 2. Veredito por serviço ---- */
function cardServicos(p){
  const rotulo = {
    prejuizo:      {cls:'bad',  txt:'Prejuízo'},
    abaixo_da_meta:{cls:'warn', txt:'Abaixo da meta'},
    ok:            {cls:'ok',   txt:'No lucro'}
  };

  /* O RPC já devolve ordenado por lucro/hora, mas o texto do alerta
     acima afirma "estão no topo da lista". Quem faz uma promessa
     na tela tem que garantir a promessa na tela — reordenar aqui
     custa nada e impede que a frase minta se o servidor mudar. */
  const lista = (p.servicos||[]).slice()
    .sort((a,b) => a.lucro_hora_cents - b.lucro_hora_cents);

  return h`<div class="card">
    <h2>Serviço por serviço</h2>
    <div class="sub">Do pior para o melhor. O número que importa é o último: quanto sobra por hora.</div>

    ${lista.length ? raw(lista.map(s => {
      const r = rotulo[s.situacao] || rotulo.ok;
      const falta = s.preco_sugerido_cents - s.preco_atual_cents;
      return h`<div class="bk prec ${s.situacao}">
        <div class="head">
          <div><div class="nm">${s.nome}</div>
            <div class="det">${s.duracao_min} min • cobra ${raw(money(s.preco_atual_cents))} hoje</div></div>
          <span class="pill ${r.cls}">${r.txt}</span>
        </div>

        <div class="conta">
          <div class="l"><span>Produto${s.material_com_perdas_cents > s.material_cents ? ' (com perdas)' : ''}</span>
            <b>${raw(money(s.material_com_perdas_cents))}</b></div>
          <div class="l"><span>${s.duracao_min} min de studio</span>
            <b>${raw(money(s.custo_tempo_cents))}</b></div>
          <div class="l total"><span>Custo do atendimento</span>
            <b>${raw(money(s.custo_total_cents))}</b></div>
        </div>

        <div class="precos">
          <div class="p"><div class="r">Mínimo</div><div class="v">${raw(money(s.preco_minimo_cents))}</div>
            <div class="obs">nem ganha nem perde</div></div>
          <div class="p alvo"><div class="r">Sugerido</div><div class="v">${raw(money(s.preco_sugerido_cents))}</div>
            <div class="obs">com ${p.margem_lucro_pct}% de margem</div></div>
        </div>

        <div class="lucro-hora ${s.lucro_hora_cents < 0 ? 'neg' : ''}">
          <span>Rende por hora</span><b>${raw(money(s.lucro_hora_cents))}/h</b>
        </div>

        ${falta > 0 ? raw(h`<div class="acts">
          <button class="btn primary sm" data-a="usarSugerido" data-id="${s.id}"
                  data-preco="${s.preco_sugerido_cents}" data-nome="${s.nome}">
            Passar para ${raw(money(s.preco_sugerido_cents))}</button>
          <span class="hint" style="align-self:center;margin:0">faltam ${raw(money(falta))}</span>
        </div>`) : ''}
      </div>`;
    }).join('')) : raw('<div class="empty">Cadastre um serviço primeiro, na aba Serviços.</div>')}
  </div>`;
}

/* ---- 6. Consumo por serviço ---- */
function cardConsumo(){
  const sel = st.servicos.find(s => s.id === st.matServico);
  const custoUnit = m => (Number(m.package_qty) > 0 ? Number(m.package_cost)/Number(m.package_qty) : 0);
  const linhas = sel ? st.consumo.filter(r => r.service_id === sel.id)
    .map(r => ({...r, mat: st.materiais.find(m => m.id === r.material_id)})).filter(r => r.mat) : [];
  const total = linhas.reduce((a,r) => a + Number(r.qty)*custoUnit(r.mat), 0);

  return h`<div class="card">
    <h2>Consumo por serviço</h2>
    <div class="sub">Quanto de cada produto sai em um atendimento.</div>

    ${st.servicos.length ? raw(h`<label for="mat_service">Serviço</label>
      <select id="mat_service">${st.servicos.map(s =>
        raw(h`<option value="${s.id}" ${s.id===st.matServico?'selected':''}>${s.nome}</option>`))}</select>`)
      : raw('<div class="empty">Cadastre um serviço primeiro.</div>')}

    ${sel ? raw(h`<div class="bk" style="margin-top:var(--s3)">
      <div class="head"><div class="nm">${sel.nome}</div>
        <b style="color:var(--pink-soft)">${raw(money(Math.round(total*100)))}</b></div>
      <div class="det">de produto por atendimento</div></div>`) : ''}

    ${linhas.length ? raw(linhas.map(r => h`<div class="bk" style="padding:var(--s3)">
      <div class="head"><div><div class="nm">${r.mat.name}</div>
        <div class="det">${r.qty} ${r.mat.unit} • ${raw(money(Math.round(r.qty*custoUnit(r.mat)*100)))}</div></div>
        <button class="btn danger sm icon-only" data-a="delConsumo" data-id="${r.id}" aria-label="Remover">${icon('x')}</button>
      </div></div>`).join(''))
      : (sel ? raw('<div class="empty">Nenhum produto vinculado a este serviço.</div>') : '')}

    ${st.materiais.length && sel ? raw(h`
      <div class="divline"></div><h3>Vincular produto</h3>
      <label for="sm_mat">Produto</label>
      <select id="sm_mat">${st.materiais.filter(m=>m.active).map(m =>
        raw(h`<option value="${m.id}">${m.name}</option>`))}</select>
      <label for="sm_qty">Quanto usa por atendimento</label>
      <input id="sm_qty" inputmode="decimal" placeholder="Ex: 2,5">
      <div style="height:var(--s3)"></div>
      <button class="btn primary" data-a="addConsumo">Salvar consumo</button>`) : ''}
  </div>`;
}

        <div class="acts">

      </div>`).join('')) : raw('<div class="empty">Nenhum servico.</div>')}
      <div class="divline"></div>
      <h3>Adicionar servico</h3>
      <label for="ns_name">Nome</label><input id="ns_name" placeholder="Ex: Spa dos pes">
      <div class="row">
        <div class="col"><label for="ns_price">Preco (R$)</label><input id="ns_price" inputmode="decimal" placeholder="80"></div>
        <div class="col"><label for="ns_dur">Duracao (min)</label><input id="ns_dur" inputmode="numeric" placeholder="60"></div>
      </div>
      <div style="height:var(--s3)"></div>
      <button class="btn primary" data-a="addServico">Adicionar</button>
    </div>`;

  st.servicos.forEach(s => {
    const inp = $('#sp_'+s.id);
    if(inp) inp.addEventListener('change', () => {
      const f = inp.files && inp.files[0]; if(!f) return;
      if(!/^image\/(jpeg|png|webp)$/.test(f.type)) return erro('Use JPG, PNG ou WEBP');
      redimensionar(f, 640, async url => {

          await tabela('services', q => q.update({ photo:url }).eq('id', s.id));
          await carregarBase(); bom('Foto atualizada ✓'); abaServicos();
        }catch(e){ erro(e.message); }

async function abaHorarios(){
  const dias = ['Domingo','Segunda','Terca','Quarta','Quinta','Sexta','Sabado'];
  const semana = st.cfg.week || [];
  painel().innerHTML = h`
    <div class="card"><h2>Dias e horarios</h2>
      <div class="sub">Marque os dias abertos e o horario de funcionamento.</div>
      <label for="slotmin">Intervalo entre horarios</label>
      <select id="slotmin">${[15,20,30,45,60].map(v => raw(h`<option value="${v}" ${st.cfg.slot_min==v?'selected':''}>${v} min</option>`))}</select>
      <div class="divline"></div>
      ${dias.map((nome,i) => { const d = semana[i] || {open:false,start:'09:00',end:'18:00'}; return raw(h`
        <div class="bk"><div class="head"><div class="nm">${nome}</div>
          <button class="btn ${d.open?'primary':'ghost'} sm" data-a="alternarDia" data-i="${i}">${d.open?'Aberto':'Fechado'}</button></div>
          ${d.open ? raw(h`<div class="row" style="margin-top:var(--s3)">
            <div class="col"><label>Abre</label><input type="time" data-hora="start" data-i="${i}" value="${d.start}"></div>
            <div class="col"><label>Fecha</label><input type="time" data-hora="end" data-i="${i}" value="${d.end}"></div></div>`) : ''}
        </div>`); })}
    </div>`;

  $('#slotmin').addEventListener('change', e => salvarHorarios({ slot_min: parseInt(e.target.value,10) }));
  document.querySelectorAll('[data-hora]').forEach(el => {
    el.addEventListener('change', () => {
      const i = Number(el.dataset.i);
      const semana2 = JSON.parse(JSON.stringify(st.cfg.week || []));
      semana2[i][el.dataset.hora] = el.value;
      salvarHorarios({ week: semana2 });
    });
  });
}

async function salvarHorarios(patch){

    bom('Horarios salvos ✓');
    if(st.aba === 'horarios') abaHorarios();
  }catch(e){ erro(e.message); }

  }catch(e){ painel().innerHTML = h`<div class="card"><div class="err">${e.message}</div></div>`; }
}

/* WhatsApp semi-automatico — mantido, e a rota sem mensalidade */
async function abrirWhats(id){
  const b = st.agenda.find(x => x.id === id)
         || (await buscarAgenda(isoLocal(new Date()), isoLocal(new Date()))).find(x => x.id === id);
  if(!b) return erro('Agendamento nao encontrado');

  const s = await tabela('settings', q => q.select('whats_template').eq('id',1).single());
  const msg = (s.whats_template||'')
    .split('{nome}').join((b.cliente_nome||'').split(' ')[0])
    .split('{servico}').join(b.servicos)
    .split('{data}').join(new Date(b.data+'T12:00:00').toLocaleDateString('pt-BR'))
    .split('{hora}').join(b.hora);

  let fone = soDigito(b.cliente_fone||'');
  if(fone && fone.length <= 11) fone = '55' + fone;
  const href = `https://wa.me/${fone}?text=${encodeURIComponent(msg)}`;

  abrirModal(h`
    <h2>Confirmar no WhatsApp</h2>
    <div class="sub">Cliente: <b>${b.cliente_nome}</b> — ${icon('phone','ico sm')} ${b.cliente_fone||'—'}</div>
    <div class="msgbox">${msg}</div>
    <a class="btn wa" href="${href}" target="_blank" rel="noopener noreferrer" data-a="fechar">Abrir no WhatsApp</a>
    <div style="height:var(--s2)"></div>
    <div class="row">
      <button class="btn ghost" data-a="copiarTexto" data-txt="${msg}">Copiar mensagem</button>
      <button class="btn ghost" data-a="copiarTexto" data-txt="${b.cliente_fone||''}">Copiar numero</button>
    </div>
    <div style="height:var(--s2)"></div>
    <button class="btn ghost sm" style="width:100%" data-a="fechar">Fechar</button>`);
}

/* ============================================================
   ASSISTENTE — a tela que a dona abre de manhã
   ------------------------------------------------------------
   Não olha só hoje: projeta 7 dias para frente. A diferença entre
   "acabou o gel" e "o gel acaba na quinta, compre até quarta" é
   toda a diferença — a primeira é um problema, a segunda é um
   recado.

   Ordem da tela por urgência, não por assunto: primeiro o que
   precisa de ação, depois quem vem, depois o resto.
============================================================ */
/* Os rótulos falam de PRAZO, não de estoque.
   "Acaba em 3 dias" não diz o que fazer; "passou o prazo do barato"
   diz — e diz também quanto custou ter esperado. */
const URGENCIA = {
  0: { cls: 'ruim',    rot: 'Falta hoje' },
  1: { cls: 'ruim',    rot: 'Passou o prazo do barato' },
  2: { cls: 'atencao', rot: 'Comprar agora' },
};

async function abaHoje(){
  carregandoPainel();
  try{
    const r = await rpc('assistente', { p_dias: st.horizonte || 7 });
    st.assist = r;

    const clientes = r.clientes_hoje || [];
    const produtos = r.produtos || [];
    const agenda   = r.agenda || [];
    const alertas  = produtos.filter(p => p.urgencia < 3);
    const conf   = clientes.filter(c => c.status === 'confirmado').length;
    const aguard = clientes.filter(c => c.status === 'pago').length;

    painel().innerHTML =
      /* ---- 1. o que precisa de ação ---- */
      (alertas.length ? h`
      <div class="card">
        <h2>Precisa de você</h2>
        <div class="sub">Olhando os próximos ${r.dias} dias de agenda.</div>
        ${alertas.map(p => raw(cartaoAlerta(p, r)))}
      </div>` : h`
      <div class="card">
        <div class="alerta bom" style="margin:0">
          <b>Tudo certo pelos próximos ${r.dias} dias.</b>
          Produto suficiente para toda a agenda confirmada.
        </div>
      </div>`)

      /* ---- 2. quem vem hoje ---- */
      + h`
      <div class="card">
        <h2>Hoje</h2>
        <div class="sub" style="text-transform:capitalize">${raw(fmtDataLonga(r.hoje))}</div>
        <div class="row" style="margin:var(--s1) 0 var(--s4)">
          <span class="pill ok">${conf} confirmada${conf!==1?'s':''}</span>
          <span class="pill warn">${aguard} aguardando</span>
        </div>
        ${clientes.length ? raw(clientes.map(c => h`<div class="bk">
          <div class="head">
            <div><div class="nm">${c.hora} · ${c.nome || '—'}</div>
              <div class="det">${c.servicos} • ${c.duracao_min} min • ${icon('phone','ico sm')} ${c.phone || '—'}</div></div>
            <span class="pill ${c.status==='pago'?'warn':'ok'}">${c.status}</span>
          </div>
          ${(c.faltando||[]).length ? raw(h`<div class="aviso-falta">
            ${icon('alertTriangle','ico sm')} falta ${(c.faltando||[]).map(x => x.nome + ' (' + x.falta + ' ' + x.unidade + ')').join(', ')}
          </div>`) : ''}
          <div class="acts">
            <button class="btn wa sm" data-a="whats" data-id="${c.id}">WhatsApp</button>
            ${c.status !== 'concluido' ? raw(h`<button class="btn primary sm" data-a="statusAdmin"
              data-id="${c.id}" data-st="concluido">Marcar atendida</button>`) : ''}
          </div>
        </div>`).join(''))
          : raw(h`<div class="empty">${emptyIcon('calendar')}Nenhuma cliente hoje.</div>`)}
      </div>`

      /* ---- 3. os próximos dias ---- */
      + (agenda.length ? h`
      <div class="card">
        <h2>Próximos dias</h2>
        <div class="sub">Quanto de agenda já está fechado.</div>
        ${agenda.map(d => raw(h`<div class="bk" style="padding:var(--s3)">
          <div class="head">
            <div><div class="nm" style="text-transform:capitalize">${raw(fmtDataLonga(d.data))}</div>
              <div class="det">${d.atendimentos} atendimento${d.atendimentos>1?'s':''} • ${raw(duracaoHoras(d.minutos))}</div></div>
            <b style="color:var(--pink-soft);white-space:nowrap">${raw(money(d.faturamento_cents))}</b>
          </div></div>`))}
      </div>` : '');
  }catch(e){
    painel().innerHTML = h`<div class="card"><h2>Hoje</h2><div class="err">${e.message}</div>
      <div class="hint">Se falar de função que não existe, rode o <b>07_precificacao_completa.sql</b>.</div></div>`;
  }
}


/* ============================================================
   INÍCIO — a primeira tela do painel
   ------------------------------------------------------------
   Não é um resumo de tudo: é a resposta para as quatro perguntas
   que ela realmente faz ao abrir o app.

     1. quanto entrou este mês?
     2. o que preciso resolver agora?
     3. quem vem hoje?
     4. quem está sumindo?

   Nessa ordem. Dinheiro primeiro porque é o que dá contexto ao
   resto; alerta em segundo porque é o único bloco que exige ação
   hoje. O que não muda o dia dela mora nas outras abas.
============================================================ */
async function abaInicio(){
  carregandoPainel();
  try{
    const [p, assist] = await Promise.all([
      rpc('painel_resumo', {}),
      rpc('assistente', { p_dias: 21 }).catch(() => null),
    ]);
    st.painel = p;
    st.assist = assist;

    const mes = p.mes || {};
    const ag  = p.agenda || {};
    const cli = p.clientes || {};
    const alertas = ((assist && assist.produtos) || []).filter(x => x.urgencia < 3);
    const chamar = p.chamar_de_volta || [];
    const nivers = cli.aniversario_hoje || [];

    const varia = mes.mes_passado_cents > 0
      ? Math.round((mes.faturado_cents - mes.mes_passado_cents) * 100 / mes.mes_passado_cents)
      : null;

    painel().innerHTML =
      /* ---------- dinheiro ---------- */
      h`<div class="card hero">
        <div class="hero-rot">Faturado em ${raw(nomeMes())}</div>
        <div class="hero-num">${raw(money(mes.faturado_cents))}</div>
        <div class="hero-linha">
          ${varia !== null ? raw(h`<span class="varia ${varia >= 0 ? 'sobe' : 'desce'}">
            ${raw(varia >= 0 ? '▲' : '▼')} ${Math.abs(varia)}%</span>
            <span class="muted">vs. mês passado (${raw(money(mes.mes_passado_cents))})</span>`)
            : raw('<span class="muted">primeiro mês com dados</span>')}
        </div>
        ${mes.agendado_cents > 0 ? raw(h`<div class="hero-extra">
          <span>Já agendado até o fim do mês</span><b>${raw(money(mes.agendado_cents))}</b>
        </div>`) : ''}
      </div>

      <div class="grade-num">
        ${raw(metrica('Hoje', ag.hoje + '', ag.hoje === 1 ? 'cliente' : 'clientes'))}
        ${raw(metrica('Nesta semana', ag.semana + '', 'agendamentos'))}
        ${raw(metrica('Agenda cheia', ag.ocupacao_semana_pct + '%', 'da semana'))}
        ${raw(metrica('Atendimentos', mes.atendimentos + '', 'no mês'))}
      </div>`

      /* ---------- o que precisa de ação ---------- */
      + ((alertas.length || ag.aguardando_confirmacao || nivers.length) ? h`
      <div class="card">
        <h2>Resolver agora</h2>
        ${ag.aguardando_confirmacao ? raw(h`<div class="acao-linha" data-a="aba" data-aba="pedidos">
          <div class="acao-ic pay">${ag.aguardando_confirmacao}</div>
          <div><div class="nm">Sinal pago, esperando você confirmar</div>
            <div class="det">Toque para abrir os pedidos</div></div>
        </div>`) : ''}
        ${nivers.map(n => raw(h`<div class="acao-linha">
          <div class="acao-ic bday">${icon('cake')}</div>
          <div><div class="nm">${n.nome} faz aniversário hoje</div>
            <div class="det">Uma mensagem custa nada e volta em agendamento</div></div>
          <button class="btn wa sm" data-a="zapDireto" data-fone="${n.phone || ''}"
            data-msg="Oi ${primeiroNome(n.nome)}! Passando para desejar feliz aniversario">Parabenizar</button>
        </div>`))}
        ${alertas.slice(0, 3).map(x => raw(cartaoAlerta(x, assist)))}
        ${alertas.length > 3 ? raw(h`<button class="btn ghost sm auto" style="margin-top:var(--s3)"
          data-a="aba" data-aba="estoque">Ver os outros ${alertas.length - 3} produtos</button>`) : ''}
      </div>` : h`
      <div class="card">
        <div class="alerta bom" style="margin:0"><b>Nada pendente.</b>
          Produto em dia e nenhum pedido esperando confirmação.</div>
      </div>`)

      /* ---------- quem vem hoje ---------- */
      + h`<div class="card">
        <div class="card-topo">
          <h2>Hoje</h2>
          <button class="btn ghost sm" data-a="aba" data-aba="agenda">Ver agenda</button>
        </div>
        <div class="sub" style="text-transform:capitalize">${raw(fmtDataLonga(p.hoje))}</div>
        ${((assist && assist.clientes_hoje) || []).length
          ? raw(assist.clientes_hoje.map(c => h`<div class="bk">
              <div class="head">
                <div><div class="nm">${c.hora} · ${c.nome || '—'}</div>
                  <div class="det">${c.servicos} • ${c.duracao_min} min</div></div>
                <span class="pill ${c.status==='pago'?'warn':'ok'}">${c.status}</span>
              </div>
              ${(c.faltando||[]).length ? raw(h`<div class="aviso-falta">
                ${icon('alertTriangle','ico sm')} falta ${(c.faltando||[]).map(x => x.nome).join(', ')}</div>`) : ''}
              <div class="acts">
                <button class="btn wa sm" data-a="whats" data-id="${c.id}">WhatsApp</button>
                ${c.status !== 'concluido' ? raw(h`<button class="btn primary sm"
                  data-a="statusAdmin" data-id="${c.id}" data-st="concluido">Marcar atendida</button>`) : ''}
              </div>
            </div>`).join(''))
          : raw(h`<div class="empty">${emptyIcon('calendar')}Nenhuma cliente hoje.</div>`)}
      </div>`

      /* ---------- quem está sumindo ---------- */
      + (chamar.length ? h`
      <div class="card">
        <div class="card-topo">
          <h2>Chamar de volta</h2>
          <button class="btn ghost sm" data-a="aba" data-aba="clientes">Ver todas</button>
        </div>
        <div class="sub">${cli.atrasadas} atrasada${cli.atrasadas===1?'':'s'} e ${cli.sumidas} sumida${cli.sumidas===1?'':'s'}.
          Estas são as que mais gastaram — as que menos vale perder.</div>
        ${chamar.map(c => raw(h`<div class="bk">
          <div class="head">
            <div><div class="nm">${c.nome}</div>
              <div class="det">${c.dias_sem_vir} dias sem vir${c.dias_de_atraso ? ' · ' + c.dias_de_atraso + ' de atraso' : ''}
                · já gastou ${raw(money(c.gasto_cents))}</div></div>
            <span class="pill ${c.situacao==='sumida'?'bad':'warn'}">${c.situacao}</span>
          </div>
          <div class="acts">
            <button class="btn wa sm" data-a="zapDireto" data-fone="${c.telefone || ''}"
              data-msg="Oi ${primeiroNome(c.nome)}! Faz um tempinho que voce nao aparece por aqui. Quer marcar sua manutencao?">Chamar</button>
            <button class="btn ghost sm" data-a="verCliente" data-id="${c.id}">Ficha</button>
          </div>
        </div>`))}
      </div>` : '');
  }catch(e){
    painel().innerHTML = h`<div class="card"><h2>Início</h2><div class="err">${e.message}</div>
      <div class="hint">Se falar de função que não existe, rode o <b>09_manutencao_e_clientes.sql</b>.</div></div>`;
  }
}

function metrica(rot, valor, apoio){
  return h`<div class="num">
    <div class="r">${rot}</div>
    <div class="v">${valor}</div>
    <div class="a">${apoio}</div>
  </div>`;
}

function nomeMes(){
  return new Date().toLocaleDateString('pt-BR', { month: 'long' });
}

/* ============================================================
   CLIENTES — com o que decide ação
============================================================ */
const SITUACAO = {
  nova:     { cls:'pay',  rot:'Nunca veio' },
  agendada: { cls:'ok',   rot:'Agendada' },
  em_dia:   { cls:'ok',   rot:'Em dia' },
  atrasada: { cls:'warn', rot:'Atrasada' },
  sumida:   { cls:'bad',  rot:'Sumida' },
};

async function abaClientes2(){
  if(st.detalheCliente) return detalheCliente(st.detalheCliente);
  carregandoPainel();
  try{
    const lista = await rpc('clientes_visao', {});
    st.clientesVisao = Array.isArray(lista) ? lista : [];
    desenharClientes();
  }catch(e){
    painel().innerHTML = h`<div class="card"><h2>Clientes</h2><div class="err">${e.message}</div>
      <div class="hint">Se falar de função que não existe, rode o <b>09_manutencao_e_clientes.sql</b>.</div></div>`;
  }
}

function desenharClientes(){
  const todas = st.clientesVisao || [];
  const filtro = st.filtroCliente || 'todas';
  const busca = (st.buscaCliente || '').toLowerCase().trim();

  const conta = s => todas.filter(c => c.situacao === s).length;
  const lista = todas.filter(c => {
    if(filtro !== 'todas' && c.situacao !== filtro) return false;
    if(!busca) return true;
    if((c.nome || '').toLowerCase().includes(busca)) return true;
    // ⚠️ So compara telefone se a busca TEM digito.
    // soDigito('juli') devolve '', e toda string contem a string
    // vazia — entao o filtro casava com todo mundo e a busca por
    // nome parecia nao funcionar.
    const digitos = soDigito(busca);
    return digitos.length > 0 && (c.telefone || '').includes(digitos);
  });

  const gastoTotal = todas.reduce((a,c) => a + Number(c.gasto_cents || 0), 0);

  painel().innerHTML = h`
    <div class="card">
      <h2>Clientes</h2>
      <div class="sub">${todas.length} cadastradas · ${raw(money(gastoTotal))} em atendimentos feitos</div>

      <div class="filtros">
        ${[['todas','Todas',todas.length],
           ['atrasada','Atrasadas',conta('atrasada')],
           ['sumida','Sumidas',conta('sumida')],
           ['agendada','Agendadas',conta('agendada')],
           ['em_dia','Em dia',conta('em_dia')],
           ['nova','Nunca vieram',conta('nova')]].map(f => raw(h`
          <div class="filtro ${filtro===f[0]?'on':''}" data-a="filtrarCliente" data-f="${f[0]}">
            ${f[1]}<span>${f[2]}</span></div>`))}
      </div>

      <label for="busca_cli">Buscar</label>
      <input id="busca_cli" placeholder="Nome ou telefone" autocomplete="off" value="${st.buscaCliente || ''}">

      ${lista.length ? raw(lista.map(cartaoCliente).join(''))
        : raw('<div class="empty">Nenhuma cliente neste filtro.</div>')}
    </div>`;

  const b = $('#busca_cli');
  if(b) b.addEventListener('input', () => {
    st.buscaCliente = b.value;
    const pos = b.selectionStart;
    desenharClientes();
    const nb = $('#busca_cli');
    if(nb){ nb.focus(); try{ nb.setSelectionRange(pos, pos); }catch(e){} }
  });
}

function cartaoCliente(c){
  const s = SITUACAO[c.situacao] || SITUACAO.em_dia;
  return h`<div class="bk cli ${c.situacao}">
    <div class="head">
      <div style="display:flex;gap:11px;align-items:center;min-width:0">
        ${raw(avatar({ first:(c.nome||'').split(' ')[0], last:(c.nome||'').split(' ')[1], photo:c.foto }))}
        <div style="min-width:0">
          <div class="nm">${c.nome || '—'}</div>
          <div class="det">${c.visitas} visita${c.visitas===1?'':'s'} · ${raw(money(c.gasto_cents))}
            ${c.ticket_medio_cents ? ' · média ' + money(c.ticket_medio_cents) : ''}</div>
        </div>
      </div>
      <span class="pill ${s.cls}">${s.rot}</span>
    </div>

    ${c.ultima_visita ? raw(h`<div class="cli-linhas">
      <div><span>Última vez</span><b>${raw(fmtData(c.ultima_visita))} · ${c.dias_sem_vir}d atrás</b></div>
      ${c.ultimo_servico ? raw(h`<div><span>Fez</span><b>${c.ultimo_servico}</b></div>`) : ''}
      ${c.volta_em ? raw(h`<div><span>Deveria voltar</span>
        <b class="${c.dias_de_atraso > 0 ? 'atraso' : ''}">${raw(fmtData(c.volta_em))}${c.dias_de_atraso > 0 ? ' · ' + c.dias_de_atraso + 'd de atraso' : ''}</b></div>`) : ''}
      ${c.proximo_em ? raw(h`<div><span>Próximo horário</span><b class="ok">${raw(fmtData(c.proximo_em))}</b></div>`) : ''}
    </div>`) : raw('<div class="hint">Cadastrou e ainda não veio.</div>')}

    <div class="acts">
      ${(c.situacao === 'atrasada' || c.situacao === 'sumida') ? raw(h`
        <button class="btn wa sm" data-a="zapDireto" data-fone="${c.telefone || ''}"
          data-msg="Oi ${primeiroNome(c.nome)}! Faz um tempinho que voce nao aparece. Quer marcar sua manutencao?">Chamar de volta</button>`) : raw(h`
        <button class="btn wa sm" data-a="zapDireto" data-fone="${c.telefone || ''}"
          data-msg="Oi ${primeiroNome(c.nome)}!">WhatsApp</button>`)}
      <button class="btn ghost sm" data-a="verCliente" data-id="${c.id}">Ficha completa</button>
      <button class="btn danger sm" data-a="apagarClienteAdmin" data-id="${c.id}" data-nome="${c.nome || 'cliente'}">Apagar cliente</button>
    </div>
  </div>`;
}

/* ------------------------------------------------------------
   O cartão de alerta.

   Mudou de assunto: antes falava de ESTOQUE ("acaba em 3 dias"),
   agora fala de PRAZO ("compre até 26/08 pela Shopee").

   A diferença importa porque o lugar barato demora. Avisar que
   acaba em 3 dias quando a Shopee leva 12 é avisar tarde — ela é
   obrigada a comprar caro na loja da esquina.
------------------------------------------------------------ */
function cartaoAlerta(p, r){
  const u = URGENCIA[p.urgencia] || URGENCIA[2];
  const melhor = p.melhor_opcao;
  const barato = p.mais_barato;
  // o mais barato existe, mas já não chega a tempo
  const perdeu = barato && melhor && barato.canal_id !== melhor.canal_id;
  const semPreco = !Number(p.qtd_opcoes);

  return h`<div class="alerta ${u.cls}" style="margin-top:var(--s3)">
    <div class="alerta-topo">
      <b>${p.nome}${p.marca ? ' · ' + p.marca : ''}</b>
      <span class="pill ${p.urgencia === 2 ? 'warn' : 'bad'}">${u.rot}</span>
    </div>

    <div class="alerta-linha"><span>Tem</span><b>${p.estoque_atual} ${p.unidade}</b></div>
    ${Number(p.precisa_ate) > 0 ? raw(h`<div class="alerta-linha">
      <span>Agenda já usa</span><b>${p.precisa_ate} ${p.unidade}</b></div>`) : ''}
    ${p.falta_em ? raw(h`<div class="alerta-linha">
      <span>Falta em</span><b>${raw(fmtDataLonga(p.falta_em))}</b></div>`) : ''}

    ${semPreco ? raw(h`<div class="alerta-acao">
      Cadastre o preço deste produto nos canais para eu calcular
      <b>até quando</b> dá para comprar no mais barato.
    </div>`) : melhor ? raw(h`
      <div class="alerta-linha destaque">
        <span>Compre até</span><b>${raw(fmtDataLonga(p.comprar_ate))}</b>
      </div>
      <div class="opcao-compra">
        <div>
          <div class="nm">${melhor.canal}</div>
          <div class="det">chega em ${melhor.prazo_dias} dia${melhor.prazo_dias===1?'':'s'}
            · ${raw(money(melhor.preco_cents))} por ${melhor.embalagem_qtd} ${p.unidade}</div>
        </div>
        <b>${raw(money(Math.round(melhor.custo_unidade_cents)))}<span>/${p.unidade}</span></b>
      </div>
      ${p.comprar_embalagens > 0 ? raw(h`<div class="alerta-acao">
        Leve <b>${p.comprar_embalagens} embalagem${p.comprar_embalagens>1?'ns':''}</b> —
        ${raw(money((melhor.preco_cents + melhor.frete_cents) * p.comprar_embalagens))} no total
      </div>`) : ''}
      ${perdeu ? raw(h`<div class="alerta-acao aviso">
        O mais barato era <b>${barato.canal}</b> (${raw(money(Math.round(barato.custo_unidade_cents)))}/${p.unidade}),
        mas com ${barato.prazo_dias} dias de entrega não chega mais a tempo.

/** "atualizado hoje" / "há 12 dias" — preço velho apresentado como
    atual é o que faz planejar errado achando que está certo. */
function diasAtras(iso){
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if(d <= 0) return 'atualizado hoje';
  if(d === 1) return 'ontem';
  if(d > 90) return 'há ' + Math.floor(d/30) + ' meses — confira';
  return 'há ' + d + ' dias';
}

/** "2h45" para 165 minutos */
function duracaoHoras(min){
  min = Number(min || 0);
  if(min < 60) return min + ' min';
  const hh = Math.floor(min / 60), mm = min % 60;
  return mm === 0 ? hh + 'h' : hh + 'h' + String(mm).padStart(2,'0');
}

/* Guardar o que foi digitado ANTES de trocar de etapa — senão a
   pessoa preenche, avança, volta, e o campo está vazio. */
function ligarCamposOnboarding(id){
  if(id === 'horario'){
    document.querySelectorAll('[data-ob-hora]').forEach(el => {
      el.addEventListener('change', () => {
        ob.week[Number(el.dataset.i)][el.dataset.obHora] = el.value;
      });
    });
  }
  if(id === 'ganhar'){
    const oc = $('#ob_ocupacao');
    if(oc) oc.addEventListener('input', () => {
      ob.ocupacao = Number(oc.value);
      const rot = document.querySelector('label[for="ob_ocupacao"]');
      if(rot) rot.textContent = 'Ocupação da agenda: ' + oc.value + '%';
    });
  }
}

function guardarEtapaAtual(){
  const id = ETAPAS[ob.etapa].id;
  const dec = el => parseFloat((el.value || '').replace(/\./g,'').replace(',','.'));

  if(id === 'ganhar'){
    ob.prolabore = $('#ob_prolabore').value;
    ob.margem = $('#ob_margem').value;
    ob.ocupacao = Number($('#ob_ocupacao').value);
  }
  if(id === 'custos'){
    document.querySelectorAll('[data-ob-custo]').forEach(el => {
      const i = Number(el.dataset.obCusto);
      ob.custos[i] = { ...CUSTOS_SUGERIDOS[i], valor: el.value };
    });
    document.querySelectorAll('[data-ob-equip]').forEach(el => {
      const i = Number(el.dataset.obEquip);
      ob.equipamentos[i] = { ...EQUIP_SUGERIDOS[i], valor: el.value };
    });
  }
  if(id === 'pix'){
    ob.pix_key = $('#ob_pixkey').value.trim();
    ob.pix_name = $('#ob_pixnome').value.trim();
    ob.pix_city = $('#ob_pixcidade').value.trim();
    ob.whats = $('#ob_whats').value;
    ob.deposit = $('#ob_dep').value;
  }
}

async function concluirOnboarding(btn){
  guardarEtapaAtual();
  const dec = v => {
    const n = parseFloat(String(v || '').replace(/\./g,'').replace(',','.'));
    return isNaN(n) ? 0 : n;
  };

  await comBotao(btn, async () => {
    try{
      await rpc('concluir_onboarding', { p: {
        week: ob.week,
        slot_min: ob.slot_min,
        regime_id: ob.regime_id,
        prolabore_cents: Math.round(dec(ob.prolabore) * 100),
        taxa_ocupacao_pct: ob.ocupacao,
        margem_lucro_pct: dec(ob.margem) || 20,
        deposit_cents: Math.round(dec(ob.deposit) * 100) || 3000,
        whats_studio: soDigito(ob.whats),
        pix_key: ob.pix_key, pix_name: ob.pix_name, pix_city: ob.pix_city,
        custos: ob.custos.filter(c => c && dec(c.valor) > 0)
          .map(c => ({ nome: c.nome, valor_cents: Math.round(dec(c.valor)*100), categoria: c.categoria })),
        equipamentos: ob.equipamentos.filter(c => c && dec(c.valor) > 0)
          .map(c => ({ nome: c.nome, valor_cents: Math.round(dec(c.valor)*100), vida_util_meses: c.vida })),
      }}, { tentativas: 1 });

      bom('Studio configurado ✓');
      ob = null;
      st.tela = 'home';
      await carregarBase();
      render();
    }catch(e){ erro(e.message); }
  });
}


/* ============================================================

   ------------------------------------------------------------
   A versao anterior montava onclick="funcao('${valor}')" dentro
   da string de HTML. Quando o valor vinha do banco, ele entrava
   dentro de codigo JavaScript, e nenhum escape de HTML protege
   esse lugar: um nome de servico com aspas ja quebrava a pagina,
   e um nome preparado de proposito executava o que quisesse.
   Aqui nao existe nenhum onclick. Os dados viajam em data-*, que
   e sempre texto, e um unico ouvinte decide o que fazer.
============================================================ */

  (mapa[st.aba] || abaInicio)();
}

      st.cursorAgenda = visao === 'mes' ? primeiroDiaMes(st.dataPainel || hojeIso()) : (st.dataPainel || hojeIso());

  calMover: (el) => {
    const scope = el.dataset.scope, dir = Number(el.dataset.d || 0);
    if(scope !== 'cliente'){
      const visao = st.visaoAgenda || 'semana';
      const base = st.cursorAgenda || st.dataPainel || hojeIso();
      st.cursorAgenda = visao === 'mes' ? mudaMes(base, dir) : somaDias(base, dir * (visao === 'semana' ? 7 : 1));
      const p = periodoAgenda(visao, st.cursorAgenda);
      st.dataPainel = p.de;
      abaAgenda();
    }
  },

    st.dataPainel = (hoje >= periodo.de && hoje <= periodo.ate) ? hoje : periodo.de;
    abaAgenda();

    });

  addCustoFixo: (el) => comBotao(el, async () => {

    const cat = $('#fx_cat').value;
    if(!nome) return erro('Diga o que é esse custo');

    try{
      await tabela('fixed_costs', q => q.insert({
        nome, valor_cents: Math.round(valor*100), categoria: cat, ativo: true }));
      bom('Custo adicionado ✓');

    if(!el.dataset.confirmado)
      return confirmar('Excluir este custo fixo?',
        'Isso muda o custo por hora e, com ele, todos os preços mínimos.',
        { a:'delCustoFixo', id:el.dataset.id });
    fecharModal();
    comBotao(el, async () => {
      try{
        await tabela('fixed_costs', q => q.delete().eq('id', el.dataset.id));
        abaPrecificacao();
      }catch(e){ erro(e.message); }
    });
  },

  salvarPrecificacao: (el) => comBotao(el, async () => {
    const dec = id => parseFloat(($('#'+id).value||'').replace(/\./g,'').replace(',','.'));
    const prolabore = dec('pr_prolabore');
    const margem    = dec('pr_margem');
    const perdas    = dec('pr_perdas');
    const impostos  = dec('pr_impostos');
    const taxa      = dec('pr_taxa');
    const ocupacao  = parseInt($('#pr_ocupacao').value, 10);

    if([prolabore,margem,perdas,impostos,taxa].some(v => isNaN(v) || v < 0))
      return erro('Preencha todos os campos com números válidos');
    if(perdas > 100) return erro('Perda de produto não pode passar de 100%');

    // O banco tem a mesma trava, mas dizer aqui explica o motivo
    // em vez de devolver erro de constraint.
    if(impostos + taxa + margem >= 95)
      return erro('Impostos + taxa + margem chegam perto de 100%. Nesse ponto não existe preço possível.');

    try{
      await tabela('settings', q => q.update({
        prolabore_cents:    Math.round(prolabore*100),
        margem_lucro_pct:   margem,
        perdas_pct:         perdas,
        impostos_pct:       impostos,
        taxa_pagamento_pct: taxa,
        taxa_ocupacao_pct:  ocupacao
      }).eq('id',1));
      bom('Recalculado ✓');
      abaPrecificacao();
    }catch(e){ erro(e.message); }
  }),

  movEstoque: (el) => {
    const tp = el.dataset.tipo;
    const titulo = tp === 'compra' ? 'Registrar compra'
                 : tp === 'perda'  ? 'Registrar perda' : 'Corrigir saldo';
    const ajuda = tp === 'compra' ? 'Quanto entrou no estoque.'
                : tp === 'perda'  ? 'Quanto foi perdido, quebrado ou venceu.'
                : 'O saldo passa a ser exatamente este número. Use quando contar na prateleira.';
    abrirModal(h`
      <h2>${titulo}</h2>
      <div class="sub">${el.dataset.nome} — ${ajuda}</div>

      <label for="mv_nota">Observação (opcional)</label>
      <input id="mv_nota" maxlength="80">

      <button class="btn ghost sm" style="width:100%" data-a="fechar">Cancelar</button>`);

  salvarMov: (el) => comBotao(el, async () => {
    const q = parseFloat(($('#mv_qtd').value || '').replace(',', '.'));
    if(isNaN(q)) return erro('Informe a quantidade');
    const tp = el.dataset.tipo;
    const nota = ($('#mv_nota').value || '').trim();
    try{
      let quantidade = Math.abs(q), obs = nota || null;
      if(tp === 'ajuste'){
        // Ajuste grava a DIFERENÇA, não o número contado. O livro-caixa
        // registra movimento; o saldo é sempre consequência dele.
        const m = st.materiais.find(x => x.id === el.dataset.id);
        quantidade = q - Number((m && m.estoque_atual) || 0);
        obs = nota || 'contagem na prateleira';

      await tabela('movimentos_estoque', qq => qq.insert({
        material_id: el.dataset.id, tipo: tp, quantidade, nota: obs }));

      abaEstoque();

    if(!fone) return erro('WhatsApp do studio não está configurado');
    if(fone.length <= 11) fone = '55' + fone;
    window.open('https://wa.me/' + fone + '?text=' + encodeURIComponent(el.dataset.msg || ''), '_blank');
  },

  /* ---- clientes ---- */
  filtrarCliente: (el) => { st.filtroCliente = el.dataset.f; desenharClientes(); },

  /* ---- WhatsApp direto, sem agendamento ---- */
  zapDireto: (el) => {
    let fone = soDigito(el.dataset.fone || '');
    if(!fone) return erro('Essa cliente não tem WhatsApp cadastrado');
    if(fone.length <= 11) fone = '55' + fone;
    window.open('https://wa.me/' + fone + '?text=' + encodeURIComponent(el.dataset.msg || ''), '_blank');
  },


  /* ---- privacidade ---- */
  lerLegal: (el) => { salvarRascunhoCadastro(); st.telaLegal = el.dataset.qual; render(); },
  voltarLegal: () => { st.telaLegal = null; render(); },
  marcarAceite: (el) => {
    st.aceiteMarcado = !st.aceiteMarcado;
    if(st.tela === 'cadastro' && !st.papel){
      salvarRascunhoCadastro();
      const marca = el.querySelector('.aceite-marca');
      if(marca){
        marca.classList.toggle('on', st.aceiteMarcado);
        marca.textContent = st.aceiteMarcado ? '✓' : '';
      }
      return;
    }
    render();
  },

  confirmarAceite: (el) => comBotao(el, async () => {
    if(!st.aceiteMarcado) return erro('Marque que você leu para continuar');
    try{
      await rpc('registrar_aceite', {
        p_politicas: (st.aceitesPendentes || []).map(x => x.id) }, { tentativas: 1 });
      st.aceitesPendentes = [];
      bom('Obrigado ✓');
      render();
    }catch(e){ erro(e.message); }
  }),

  baixarDados: (el) => comBotao(el, async () => {
    try{
      const d = await rpc('exportar_meus_dados', {}, { tentativas: 1 });
      const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'meus-dados-alternativa-studio.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      bom('Arquivo baixado ✓');
    }catch(e){ erro(e.message); }
  }),

  apagarConta: () => {
    abrirModal(h`
      <h2>Apagar minha conta</h2>
      <div class="sub">Isso apaga seu cadastro, suas avaliações e as anotações sobre você.
        Seus atendimentos já feitos viram registro anônimo — a lei exige que o studio
        guarde a contabilidade dele.</div>
      <div class="err" style="display:block">Não dá para desfazer.</div>
      <label for="ap_conf">Digite APAGAR para confirmar</label>
      <input id="ap_conf" placeholder="APAGAR" autocapitalize="characters">
      <div style="height:var(--s3)"></div>
      <button class="btn danger" data-a="confirmarApagar">Apagar minha conta</button>
      <div style="height:var(--s2)"></div>
      <button class="btn ghost sm" style="width:100%" data-a="fechar">Cancelar</button>`);
  },

  confirmarApagar: (el) => comBotao(el, async () => {
    try{
      await rpc('apagar_minha_conta', { p_confirmacao: $('#ap_conf').value }, { tentativas: 1 });
      fecharModal();
      await supa.auth.signOut();
      Object.assign(st, { papel:null, uid:null, perfil:null, meus:[], tela:'home' });
      toast('Sua conta foi apagada.');
      render();
    }catch(e){ erro(e.message); }
  }),

  addMaterial: (el) => comBotao(el, async () => {
    const nome = $('#mt_name').value.trim();
    const custo = parseFloat(($('#mt_cost').value||'').replace(',','.'));
    const qtd   = parseFloat(($('#mt_qty').value||'').replace(',','.'));
    const un    = ($('#mt_unit').value||'un').trim();
    if(!nome || !(custo>0) || !(qtd>0)) return erro('Preencha material, custo e quantidade');
    try{
      await tabela('materials', q => q.insert({ name:nome, unit:un, package_cost:custo, package_qty:qtd, active:true }));
      bom('Material adicionado ✓'); abaPrecificacao();
    }catch(e){ erro(e.message); }
  }),
  delMaterial: (el) => comBotao(el, async () => {
    try{ await tabela('materials', q => q.delete().eq('id', el.dataset.id)); abaPrecificacao(); }
    catch(e){ erro(e.message); }
  }),
  addConsumo: (el) => comBotao(el, async () => {
    const mat = $('#sm_mat').value;
    const qtd = parseFloat(($('#sm_qty').value||'').replace(',','.'));
    if(!mat || !(qtd>0)) return erro('Informe a quantidade usada');
    try{
      await tabela('service_materials', q => q.upsert(
        { service_id: st.matServico, material_id: mat, qty: qtd }, { onConflict:'service_id,material_id' }));
      bom('Consumo salvo ✓'); abaPrecificacao();
    }catch(e){ erro(e.message); }
  }),
  delConsumo: (el) => comBotao(el, async () => {
    try{ await tabela('service_materials', q => q.delete().eq('id', el.dataset.id)); abaPrecificacao(); }
    catch(e){ erro(e.message); }
  }),

  addServico: (el) => comBotao(el, async () => {
    const nome = $('#ns_name').value.trim();
    const preco = parseFloat(($('#ns_price').value||'').replace(',','.'));
    const dur = parseInt($('#ns_dur').value,10);
    if(!nome || !(preco>=0) || !(dur>0)) return erro('Preencha nome, preco e duracao');
    if(dur > 600) return erro('Duracao maxima: 600 minutos');
    try{
      await tabela('services', q => q.insert({ name:nome, price_cents:Math.round(preco*100), dur, ativo:true }));
      await carregarBase(); bom('Servico adicionado ✓'); abaServicos();
    }catch(e){ erro(e.message); }
  }),
  delServico: (el) => comBotao(el, async () => {
    try{
      // Excluir de vez quebraria o historico (booking_services aponta
      // para ca). Desativar tira da vitrine e preserva o passado.
      await tabela('services', q => q.update({ ativo:false }).eq('id', el.dataset.id));
      await carregarBase(); bom('Servico desativado'); abaServicos();
    }catch(e){ erro(e.message); }
  }),
  fotoServico: (el) => { const i = $('#sp_'+el.dataset.id); if(i) i.click(); },

  alternarDia: (el) => {
    const i = Number(el.dataset.i);
    const semana = JSON.parse(JSON.stringify(st.cfg.week || []));
    semana[i].open = !semana[i].open;
    salvarHorarios({ week: semana });
  },

  salvarConfig: (el) => comBotao(el, async () => {
    const dep = parseFloat(($('#cf_dep').value||'').replace(',','.'));
    if(!(dep >= 0)) return erro('Valor do sinal invalido');
    try{
      await tabela('settings', q => q.update({
        pix_key:  $('#cf_key').value.trim(),
        pix_name: $('#cf_name').value.trim(),
        pix_city: $('#cf_city').value.trim(),
        whats_studio: soDigito($('#cf_whats').value),
        deposit_cents: Math.round(dep*100),
        prazo_sinal_h:      parseInt($('#cf_prazo').value,10)  || 24,
        min_antecedencia_h: parseInt($('#cf_ant').value,10)    || 2,
        max_antecedencia_d: parseInt($('#cf_max').value,10)    || 60,
        cancel_livre_h:     parseInt($('#cf_livre').value,10)  || 24,
        max_ativos_cliente: parseInt($('#cf_ativos').value,10) || 3,
        whats_template: $('#cf_msg').value
      }).eq('id',1));
      await carregarBase(); bom('Configuracoes salvas ✓');
    }catch(e){ erro(e.message); }
  })
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if(!el) return;
  const fn = ACOES[el.dataset.a];
  if(!fn) return;
  if(el.tagName !== 'A') e.preventDefault();
  try{ fn(el, e); }catch(err){ console.error(err); erro('Algo deu errado. Tente de novo.'); }
});

/* Mesma acao pelo teclado, para quem nao usa mouse nem toque */
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('[data-a][tabindex]');
  if(!el) return;
  e.preventDefault();
  const fn = ACOES[el.dataset.a];
  if(fn) fn(el, e);
});

/* ------------------------------------------------------------
   Tempo real: se outra cliente marcar enquanto esta tela esta
   aberta, o horario some daqui sem precisar recarregar.
------------------------------------------------------------ */
function ligarTempoReal(){
  supa.channel('agenda')
    .on('postgres_changes', { event:'*', schema:'public', table:'bookings' }, () => {
      if(st.tela === 'agendar' && st.nav.passo === 2){
        st.dispMesKey = null;
        carregarDisponibilidadeMes();
        if(st.nav.data) buscarLivres();
      }
      if(st.papel === 'admin' && ['inicio','resumo','hoje','agenda','pedidos'].includes(st.aba)){
        atualizarPainelAtual();
      }
    })
    .subscribe();
}

/* ------------------------------------------------------------
   Sessao
------------------------------------------------------------ */
async function iniciarSessao(){
  st.carregando = true; render();
  try{
    await entrar();
    await sincronizarPendencias();
    await carregarBase();
    if(st.papel === 'cliente') await carregarMeus();
    st.carregando = false;
    if(st.precisaOnboarding){ st.precisaOnboarding = false; return iniciarOnboarding(); }
    render();
    ligarTempoReal();
  }catch(e){
    st.carregando = false;
    st.erroFatal = e.message;
    render();
  }
}

async function sair(){
  await supa.auth.signOut();
  Object.assign(st, {
    papel:null, uid:null, perfil:null, meus:[], tela:'home', aba:'inicio',
    clientes:[], agenda:[], detalheCliente:null, erroFatal:null, captcha:{}, captchaLiberado:false
  });
  render();
}

supa.auth.onAuthStateChange((evento) => {
  if(evento === 'PASSWORD_RECOVERY'){ st.carregando = false; st.tela = 'novaSenha'; render(); }
  if(evento === 'SIGNED_OUT'){ st.papel = null; st.captcha = {}; st.captchaLiberado = false; render(); }
});

prepararInstalacao();

(async function(){
  try{
    if(location.hash.includes('type=recovery')){
      st.carregando = false; st.tela = 'novaSenha'; return render();
    }
    const { data:{ session } } = await supa.auth.getSession();
    if(session){
      const saude = await verificarSaude();
      if(!saude.ok){
        st.carregando = false;
        st.foraDoAr = saude.tipo;
        return render();
      }
      await iniciarSessao();
    }else{
      st.carregando = false;
      render();
      verificarSaude().then(saude => {
        if(!saude.ok && !st.papel){
          st.foraDoAr = saude.tipo;
          render();
        }
      }).catch(() => {});
    }
  }catch(e){
    console.error(e);
    st.carregando = false;
    st.erroFatal = 'Nao consegui falar com o servidor. Verifique sua conexao.';
    render();
  }
})();
</script>
