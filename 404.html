<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Pagina nao encontrada | Alternativa Studio</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root{color-scheme:dark;--bg:#12060d;--panel:#1b0c14;--line:#513043;--pink:#ff7eb6;--soft:#ffd1e3;--text:#fff4fa;--muted:#caa0b5}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#3b1027 0,#12060d 48%,#080407 100%);color:var(--text);font-family:Inter,Arial,sans-serif;padding:24px}
    main{width:min(520px,100%);border:1px solid var(--line);background:rgba(18,6,13,.78);padding:34px;border-radius:8px;box-shadow:0 28px 80px rgba(0,0,0,.35)}
    h1{margin:0 0 12px;font-size:clamp(32px,6vw,56px);line-height:.95;color:var(--soft);letter-spacing:0}
    p{margin:0 0 24px;color:var(--muted);font-size:16px;line-height:1.55}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:8px;background:linear-gradient(135deg,#ff7eb6,#bd2a70);color:#16040d;text-decoration:none;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    a:focus-visible{outline:2px solid var(--soft);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Essa pagina nao existe ou mudou de lugar. Volte para o agendamento para continuar.</p>
    <a href="/">Voltar para o site</a>
  </main>
</body>
</html>
